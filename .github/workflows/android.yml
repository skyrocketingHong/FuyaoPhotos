name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Unit tests, lint and Debug/Release APKs
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FuyaoPhotoInfo-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/tests/testAndroidDom/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
