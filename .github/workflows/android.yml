name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Unit tests, lint and Debug/Release APKs
        run: bash android/scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FuyaoPhotos-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/tests/testAndroidDom/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-release.html
